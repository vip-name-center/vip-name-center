<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="siteTitleNav">VIP Style Name Center</title>
    
    <!-- PWA Web App Icons & Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" id="favicon" href="logo.png">
    <link rel="apple-touch-icon" id="appleIcon" href="logo.png">
    <meta name="theme-color" content="#0d0e15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #08090c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        header {
            width: 100%;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #11131c;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-box img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            object-fit: cover;
        }

        .site-title {
            font-size: 17px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
        }

        /* Fast Performance Search Box */
        .search-box {
            width: 90%;
            max-width: 420px;
            margin: 12px 0;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #ffd700;
            background: #12141f;
            color: #ffd700;
            outline: none;
            font-size: 14px;
            text-align: center;
        }

        .social-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 90%;
            max-width: 420px;
        }

        .social-card {
            flex: 1;
            padding: 8px 4px;
            background: #141724;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
            font-size: 11px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .social-card.tiktok { border-color: #ff0050; color: #ff0050; }
        .social-card.telegram { border-color: #0088cc; color: #0088cc; }
        .social-card.youtube { border-color: #ff0000; color: #ff0000; }
        .social-card.facebook { border-color: #1877f2; color: #1877f2; }

        .generator-box {
            width: 90%;
            max-width: 420px;
            background: #12141f;
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .generator-box h3 {
            font-size: 13px;
            color: #00ffcc;
            margin-bottom: 8px;
        }

        .generator-box input {
            width: 65%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #00ffcc;
            background: #000;
            color: #fff;
            outline: none;
            font-size: 12px;
        }

        .generator-box button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            font-size: 12px;
        }

        /* Optimized Smooth Scroll Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 92%;
            max-width: 420px;
            will-change: transform;
        }

        .card {
            background: #11131d;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            transform: translateZ(0); /* Hardware Acceleration */
        }

        .card:active {
            background: #1c2030;
            transform: scale(0.97);
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            background: #ffd700;
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            display: none;
            z-index: 200;
        }

        .admin-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .admin-box {
            background: #141724;
            border: 2px solid #ffd700;
            width: 85%;
            max-width: 350px;
            border-radius: 12px;
            padding: 18px;
        }

        .admin-box h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .admin-box input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            border: 1px solid #ffd700;
            background: #08090c;
            color: #fff;
            font-size: 12px;
        }

        .admin-box button {
            width: 100%;
            padding: 9px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box" onclick="handleTitleClick()">
            <img id="siteLogo" src="logo.png" alt="Logo">
            <span id="siteTitle" class="site-title">ᴹᴿ〲ʟᴀʟᴀ²⁸</span>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="নাম্বার (যেমন: 15) বা নাম লিখে সার্চ করুন..." oninput="filterNames()">
    </div>

    <div class="social-nav">
        <a id="linkTiktok" href="#" target="_blank" class="social-card tiktok">TikTok</a>
        <a id="linkTelegram" href="#" target="_blank" class="social-card telegram">Telegram</a>
        <a id="linkYoutube" href="#" target="_blank" class="social-card youtube">YouTube</a>
        <a id="linkFacebook" href="#" target="_blank" class="social-card facebook">Facebook</a>
    </div>

    <div class="generator-box">
        <h3>নিজের নাম স্টাইল করুন</h3>
        <input type="text" id="customInput" placeholder="ex: miss Mim10">
        <button onclick="generateCustomName()">মেক</button>
    </div>

    <div class="grid-container" id="nameGrid"></div>

    <div id="toast" class="toast">কপি করা হয়েছে!</div>

    <div id="adminModal" class="admin-modal">
        <div class="admin-box">
            <h2>VIP Admin Panel</h2>
            <div id="loginForm">
                <input type="password" id="adminPass" placeholder="পাসওয়ার্ড লিখুন">
                <button onclick="checkAdminPass()">Login</button>
            </div>
            <div id="controlForm" style="display: none;">
                <input type="text" id="editTitle" placeholder="ওয়েবসাইট টাইটেল">
                <input type="text" id="editLogo" placeholder="লোগো Image URL (Direct Link)">
                <input type="text" id="editTikTok" placeholder="TikTok Link">
                <input type="text" id="editTelegram" placeholder="Telegram Link">
                <input type="text" id="editYouTube" placeholder="YouTube Link">
                <input type="text" id="editFacebook" placeholder="Facebook Link">
                <button onclick="saveAdminData()">Save & Update</button>
                <button onclick="closeAdmin()" style="background: #ff4757; color: #fff;">Close</button>
            </div>
        </div>
    </div>

    <script src="names.js"></script>

    <script>
        let settings = JSON.parse(localStorage.getItem('vip_site_settings')) || {
            title: "ᴹᴿ〲ʟᴀʟᴀ²⁸",
            logo: "https://i.ibb.co/L5342S0/gold-logo.png", // ডিফল্ট গোল্ড লোগো ইউআরএল
            tiktok: "https://tiktok.com",
            telegram: "https://t.me",
            youtube: "https://youtube.com",
            facebook: "https://facebook.com"
        };

        function applySettings() {
            document.getElementById('siteTitle').innerText = settings.title;
            document.getElementById('siteTitleNav').innerText = settings.title;
            document.getElementById('siteLogo').src = settings.logo;
            document.getElementById('favicon').href = settings.logo;
            document.getElementById('appleIcon').href = settings.logo;
            document.getElementById('linkTiktok').href = settings.tiktok;
            document.getElementById('linkTelegram').href = settings.telegram;
            document.getElementById('linkYoutube').href = settings.youtube;
            document.getElementById('linkFacebook').href = settings.facebook;
        }

        const colors = ['#00ffcc', '#ff007f', '#ffd700', '#00bfff', '#ff8c00', '#00ff7f'];

        function renderGrid(dataList) {
            const grid = document.getElementById('nameGrid');
            grid.innerHTML = '';
            
            // Render visible cards smoothly
            const fragment = document.createDocumentFragment();
            dataList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const randomColor = colors[item.id % colors.length];
                card.innerHTML = `<div class="card-name" style="color: ${randomColor}">${item.text}</div>`;
                card.onclick = () => copyText(item.text);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1200);
        }

        // Accurate Instant Search Logic
        function filterNames() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!query) {
                renderGrid(nameList);
                return;
            }

            const filtered = nameList.filter(item => {
                const isIdMatch = item.id.toString() === query;
                const isTextMatch = item.text.toLowerCase().includes(query);
                return isIdMatch || isTextMatch;
            });

            renderGrid(filtered);
        }

        function convertToVipFont(text) {
            const map = {
                'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ꜰ','g':'ɢ','h':'ʜ','i':'ɪ',
                'j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'Q','r':'ʀ',
                's':'s','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ',
                '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'
            };
            
            let parts = text.trim().split(" ");
            if (parts.length < 2) return text;

            let firstName = parts[0].toLowerCase().split('').map(c => map[c] || c).join('');
            let lastName = parts.slice(1).join('').toLowerCase().split('').map(c => map[c] || c).join('');

            return `${firstName.toUpperCase()}〲${lastName}`;
        }

        function generateCustomName() {
            const input = document.getElementById('customInput').value;
            if(!input) return;
            const vipName = convertToVipFont(input);
            copyText(vipName);
            alert('আপনার VIP নাম তৈরি ও কপি করা হয়েছে:\n' + vipName);
        }

        let clickCount = 0;
        let clickTimer;
        function handleTitleClick() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount === 4) {
                document.getElementById('adminModal').style.display = 'flex';
                clickCount = 0;
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        }

        function checkAdminPass() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'lala') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('controlForm').style.display = 'block';
                
                document.getElementById('editTitle').value = settings.title;
                document.getElementById('editLogo').value = settings.logo;
                document.getElementById('editTikTok').value = settings.tiktok;
                document.getElementById('editTelegram').value = settings.telegram;
                document.getElementById('editYouTube').value = settings.youtube;
                document.getElementById('editFacebook').value = settings.facebook;
            } else {
                alert('ভুল পাসওয়ার্ড!');
            }
        }

        function saveAdminData() {
            settings.title = document.getElementById('editTitle').value;
            settings.logo = document.getElementById('editLogo').value;
            settings.tiktok = document.getElementById('editTikTok').value;
            settings.telegram = document.getElementById('editTelegram').value;
            settings.youtube = document.getElementById('editYouTube').value;
            settings.facebook = document.getElementById('editFacebook').value;

            localStorage.setItem('vip_site_settings', JSON.stringify(settings));
            applySettings();
            closeAdmin();
            alert('সফলভাবে আপডেট করা হয়েছে!');
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('controlForm').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        window.onload = () => {
            applySettings();
            renderGrid(nameList);
        };
    </script>
</body>
</html>
